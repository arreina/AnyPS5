name: Fork build

on:
  push:
    branches: ['sync/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

jobs:
  eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ github.sha }}
      pr: ''
      head: ''
      relinker: 'false'
      full: 'true'
    steps:
      - run: echo "Building ${{ github.sha }} with full Linux and Windows builds and tests"

  linux:
    needs: eligibility
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.eligibility.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          submodules: true
      - name: Merge the pull request into main
        if: ${{ needs.eligibility.outputs.head != '' }}
        shell: bash
        env:
          PR_NUMBER: ${{ needs.eligibility.outputs.pr }}
          PR_HEAD: ${{ needs.eligibility.outputs.head }}
        run: |
          git fetch --no-tags --unshallow origin "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$PR_HEAD" ]; then echo "::error::The pull request has newer commits; start a new build"; exit 1; fi
          if ! git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-edit FETCH_HEAD; then echo "::error::The pull request does not merge cleanly into main; rebase it first"; exit 1; fi
          git submodule update --init --recursive
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: linux
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          evict-old-files: job
      - name: Install lavapipe for the GPU execution tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev
      - run: cmake -S . -B build $CONFIGURE -DANYPS5_ENABLE_SPIRV_TOOLS=ON
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - run: cmake --build build
      - run: cmake --build build --target libs
      - run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log --output-junit ctest.xml
        env:
          ANYPS5_REQUIRE_VULKAN: 1
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - run: python3 tools/check_skips.py build/ctest.xml
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log

  windows:
    needs: eligibility
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.eligibility.outputs.full == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
      WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip
      SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
          persist-credentials: false
          submodules: true
      - name: Merge the pull request into main
        if: ${{ needs.eligibility.outputs.head != '' }}
        shell: bash
        env:
          PR_NUMBER: ${{ needs.eligibility.outputs.pr }}
          PR_HEAD: ${{ needs.eligibility.outputs.head }}
        run: |
          git fetch --no-tags --unshallow origin "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$PR_HEAD" ]; then echo "::error::The pull request has newer commits; start a new build"; exit 1; fi
          if ! git -c user.name=ci -c user.email=ci@localhost merge --no-ff --no-edit FETCH_HEAD; then echo "::error::The pull request does not merge cleanly into main; rebase it first"; exit 1; fi
          git submodule update --init --recursive
      - id: toolchain
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          evict-old-files: job
      - shell: cmd
        run: cmake -S . -B build %CONFIGURE%
      - name: Check that every test executable is registered with ctest
        shell: cmd
        run: python tools/check_test_registration.py build
      - shell: cmd
        run: cmake --build build
      - shell: cmd
        run: cmake --build build --target libs
      - shell: cmd
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log --output-junit ctest.xml
      - run: python tools/check_skips.py build/ctest.xml --job windows
      - name: Report tests slower than 30 s
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f ctest.log ] || exit 0
          awk '/Test +#[0-9]+: / && $NF == "sec" { for (i = 1; i <= NF; i++) if ($i ~ /^#[0-9]+:$/) name = $(i + 1); t = $(NF - 1) + 0; if (t > max[name]) max[name] = t }
            END { for (name in max) if (max[name] > 30) printf "::warning title=Slow test::%s took %.1f s on %s; tests must finish in 30 s (CONTRIBUTING.md)\n", name, max[name], ENVIRON["RUNNER_OS"] }' ctest.log
