name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relinker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ANYPS5_MALFORMED_ELF_CASES: '2000'
      ANYPS5_MALFORMED_UNWIND_CASES: '2000'
      ANYPS5_MALFORMED_STRICT_CASES: '1000'
      ANYPS5_MALFORMED_GUEST_CASES: '1000'
      ANYPS5_DECODER_FUZZ_CASES: '200000'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -DANYPS5_SANITIZERS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build --target core/relinker/all
      - run: ctest --test-dir build/core/relinker --output-on-failure --timeout 600

  libs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/tools/ubsan-suppressions.txt
      ASAN_OPTIONS: suppressions=${{ github.workspace }}/tools/asan-suppressions.txt
      ANYPS5_SHADER_CACHE_FUZZ_CASES: '200000'
      ANYPS5_RDNA_FUZZ_CASES: '100000'
      ANYPS5_JSON_FUZZ_CASES: '100000'
      ANYPS5_PM4_FUZZ_CASES: '2000000'
      ANYPS5_ATRAC9_FUZZ_CASES: '2000000'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -DANYPS5_SANITIZERS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - run: |
          targets=$(cmake --build build --target help | grep -oE '\b[A-Za-z0-9_]+_tests\b' | grep -E '^(agc_|guest_json|guest_ajm|guest_audiodec|ngs2_)' | sort -u)
          echo "Building $targets"
          cmake --build build --target $targets
      - run: ctest --test-dir build -R '^(agc_|guest_json|guest_ajm|guest_audiodec|ngs2_)' --output-on-failure --timeout 1200

  recompiler-spirv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      ASAN_OPTIONS: detect_leaks=0:suppressions=${{ github.workspace }}/tools/asan-suppressions.txt
      ANYPS5_NO_SHADER_CACHE: '1'
      ANYPS5_RECOMPILER_FUZZ_CASES: '3000'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -DANYPS5_SANITIZERS=ON -DANYPS5_ENABLE_SPIRV_TOOLS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build --target agc_recompiler_fuzz_tests agc_pixel_position_export_tests agc_pixel_lds_atomic_tests
      - run: ctest --test-dir build -R '^agc_(recompiler_fuzz|pixel_position_export|pixel_lds_atomic)$' --output-on-failure --timeout 2400
